server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # TrueNAS / reverse-proxy friendly
    absolute_redirect off;

    # Health check for Docker / TrueNAS
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff;
        add_header X-Frame-Options SAMEORIGIN;
        add_header Referrer-Policy no-referrer;
    }

    # Single-page app — only index.html is required
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Deny hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
